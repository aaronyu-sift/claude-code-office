<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="app.name">Claude Code Office</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='5' fill='%2312161d' stroke='%239085e9' stroke-width='2'/%3E%3Crect x='8' y='11' width='6' height='5' rx='1' fill='%23fab219'/%3E%3Crect x='18' y='11' width='6' height='5' rx='1' fill='%239085e9'/%3E%3Crect x='8' y='19' width='6' height='5' rx='1' fill='%233987e5'/%3E%3Crect x='18' y='19' width='6' height='5' rx='1' fill='%23199e70'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="8" y="11" width="6" height="5" rx="1" fill="#fab219"/><rect x="18" y="11" width="6" height="5" rx="1" fill="#9085e9"/><rect x="8" y="19" width="6" height="5" rx="1" fill="#3987e5"/><rect x="18" y="19" width="6" height="5" rx="1" fill="#199e70"/></svg>
    <span data-i18n="app.name">Claude Code Office</span>
  </div>
  <nav class="seg" role="tablist" aria-label="View" data-i18n-aria="nav.label">
    <button role="tab" id="tab-pano" aria-controls="view-pano" data-view="pano" title="Dashboard (1)" data-i18n="tab.pano" data-i18n-title="tab.pano.tip">Dashboard</button>
    <button role="tab" id="tab-ofis" aria-controls="view-ofis" data-view="ofis" title="Office (2)" data-i18n="tab.ofis" data-i18n-title="tab.ofis.tip">Office</button>
    <button role="tab" id="tab-akis" aria-controls="view-akis" data-view="akis" title="Timeline (3)" data-i18n="tab.akis" data-i18n-title="tab.akis.tip">Timeline</button>
    <button role="tab" id="tab-maliyet" aria-controls="view-maliyet" data-view="maliyet" title="Cost (4)" data-i18n="tab.maliyet" data-i18n-title="tab.maliyet.tip">Cost</button>
    <button role="tab" id="tab-settings" aria-controls="view-settings" data-view="settings" title="Settings (5)" data-i18n="tab.settings" data-i18n-title="tab.settings.tip">Settings</button>
  </nav>
  <div class="seg small proj-seg" id="proj-seg" role="group" aria-label="Camera view" data-i18n-aria="proj.label" hidden>
    <button type="button" data-proj="iso" aria-pressed="true" title="Isometric view" data-i18n="proj.iso" data-i18n-title="proj.iso.tip">Isometric</button>
    <button type="button" data-proj="front" aria-pressed="false" title="Front three-quarter view" data-i18n="proj.front" data-i18n-title="proj.front.tip">Front</button>
  </div>
  <div class="set-wrap" id="set-wrap" hidden>
    <button type="button" class="icon-btn" id="set-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="set-pop" title="Scene settings" data-i18n-title="set.tip">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.6"/><circle cx="6" cy="11.5" r="1.6"/></svg>
    </button>
    <div class="set-pop" id="set-pop" role="dialog" aria-label="Scene settings" data-i18n-aria="set.title" hidden>
      <div class="set-row" data-row="camera"><span class="set-l" data-i18n="set.camera">Camera</span>
        <div class="seg small proj-seg" role="group" aria-label="Camera view" data-i18n-aria="proj.label">
          <button type="button" data-proj="iso" aria-pressed="true" data-i18n="proj.iso">Isometric</button>
          <button type="button" data-proj="front" aria-pressed="false" data-i18n="proj.front">Front</button>
        </div></div>
      <div class="set-row" data-row="time"><span class="set-l" data-i18n="set.time">Time of day</span>
        <div class="seg small" id="set-time-mode" role="group">
          <button type="button" data-v="auto" aria-pressed="true" data-i18n="set.timeAuto">Auto</button>
          <button type="button" data-v="fixed" aria-pressed="false" data-i18n="set.timeFixed">Fixed</button>
        </div></div>
      <div class="set-row set-time"><input type="range" id="set-time" min="0" max="1435" step="5" value="720" aria-valuetext="12:00" aria-label="Time of day" data-i18n-aria="set.time"><output id="set-time-out" for="set-time">12:00</output></div>
      <div class="set-row" data-row="season"><label class="set-l" for="set-season" data-i18n="set.season">Season</label>
        <select id="set-season"><option value="auto" data-i18n="set.seasonAuto">Auto (by date)</option><option value="spring" data-i18n="season.spring">Spring</option><option value="summer" data-i18n="season.summer">Summer</option><option value="autumn" data-i18n="season.autumn">Autumn</option><option value="winter" data-i18n="season.winter">Winter</option></select></div>
      <div class="set-row" data-row="hemisphere"><label class="set-l" for="set-hemisphere" data-i18n="set.hemisphere">Hemisphere</label>
        <select id="set-hemisphere"><option value="north" data-i18n="hemi.north">North</option><option value="south" data-i18n="hemi.south">South</option></select></div>
      <div class="set-row" data-row="weather"><label class="set-l" for="set-weather" data-i18n="set.weather">Weather</label>
        <select id="set-weather"><option value="off" data-i18n="weather.off">Off</option><option value="auto" data-i18n="weather.auto">Auto (by date)</option><option value="clear" data-i18n="weather.clear">Clear</option><option value="cloudy" data-i18n="weather.cloudy">Cloudy</option><option value="rain" data-i18n="weather.rain">Rain</option><option value="snow" data-i18n="weather.snow">Snow</option><option value="fog" data-i18n="weather.fog">Fog</option></select></div>
      <div class="set-row" data-row="shelf"><label class="set-l" for="set-shelf" data-i18n="set.shelf">Chats on the shelf</label>
        <select id="set-shelf"><option value="5">5</option><option value="10" selected>10</option><option value="20">20</option><option value="50">50</option></select></div>
      <div class="set-row" data-row="project"><label class="set-l" for="set-project" data-i18n="set.project">Project folder on boards</label>
        <label class="toggle"><input type="checkbox" role="switch" id="set-project"><span></span></label></div>
      <p class="set-note" id="set-note" hidden></p>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="accts" id="accts"></div>
  <button id="lang" class="icon-btn lang-btn" type="button"></button>
  <button id="bell" class="icon-btn" type="button"></button>
  <span id="conn" class="conn" title="Live connection" data-i18n-title="conn.live"></span>
</header>

<div id="attention" class="attention" hidden></div>

<main>
  <section id="view-pano" class="view" role="tabpanel" aria-labelledby="tab-pano" hidden></section>
  <section id="view-ofis" class="view view-ofis" role="tabpanel" aria-labelledby="tab-ofis" hidden></section>
  <section id="view-akis" class="view view-akis" role="tabpanel" aria-labelledby="tab-akis" hidden>
    <div class="akis-bar">
      <div class="seg small" id="akis-range">
        <button data-r="15" data-i18n="akis.r15">15m</button><button data-r="60" data-i18n="akis.r60">1h</button><button data-r="180" data-i18n="akis.r180">3h</button><button data-r="360" data-i18n="akis.r360">6h</button>
      </div>
      <label class="toggle" data-i18n-tail="akis.subs"><input type="checkbox" id="akis-subs" checked><span></span>Subagents</label>
      <label class="toggle" data-i18n-tail="akis.dormant"><input type="checkbox" id="akis-dormant"><span></span>Asleep</label>
      <div class="legend" id="akis-legend"></div>
    </div>
    <div class="akis-axis"><canvas id="akis-axis"></canvas></div>
    <div class="akis-scroll" id="akis-scroll"><canvas id="akis"></canvas></div>
  </section>
  <section id="view-maliyet" class="view view-maliyet" role="tabpanel" aria-labelledby="tab-maliyet" hidden></section>
  <section id="view-settings" class="view view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
</main>

<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="tip" class="tip" role="tooltip"></div>

<script type="module" src="js/i18n.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
